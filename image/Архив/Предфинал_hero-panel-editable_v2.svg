    .label { font-family: 'Marck Script', 'Neucha', cursive; font-size: 92px; font-weight: 400; fill: #ffffff; }
    .placeholder { font-family: Arial, Helvetica, sans-serif; font-size: 38px; fill: #123a75; fill-opacity: 0.72; }
    .btn-text { font-family: Arial, Helvetica, sans-serif; font-size: 42px; font-weight: 700; fill: #123a75; }
  </style>
