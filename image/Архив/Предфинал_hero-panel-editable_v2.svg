  <desc
     id="desc1">Editable twin of the live hero search panel: hero-clean.jpg background (the source mockup photo with the baked-in UI removed) plus real vector fields/buttons matching the site's layout. Images are linked by relative path (hero-clean.jpg, icon-driver.png, icon-passenger.png, icon-companion.png) — keep this SVG in the same &quot;image&quot; folder.</desc>
